plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

def discordAar = file('libs/discord_partner_sdk.aar')
def discordSdkDir = file('src/main/cpp/discord-sdk')
if (discordAar.exists() && !discordSdkDir.exists()) {
    // Unpack the AAR ourselves (headers + .so) so CMake doesn't need Prefab,
    // whose helper script can't run from shared storage on-device.
    ant.unzip(src: discordAar, dest: discordSdkDir)
}

android {
    namespace 'cc.yetracker.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'cc.yetracker.mobile'
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    if (discordAar.exists()) {
        // Discord Social SDK found: build the JNI bridge against the unpacked AAR (no Prefab).
        ndkVersion '28.2.13676358'
        defaultConfig {
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        externalNativeBuild {
            cmake {
                path 'src/main/cpp/CMakeLists.txt'
                version '4.1.2'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
        }
    }
}

dependencies {
    implementation 'androidx.browser:browser:1.8.0'
    if (discordAar.exists()) {
        implementation files('libs/discord_partner_sdk.aar')
    }
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.session
}
